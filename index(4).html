<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisão de Partida</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#302e2b;color:#fff;font:600 14px "Nunito","Segoe UI",system-ui,sans-serif}
main{display:flex;gap:40px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:8px 16px}
#left{width:min(100%,calc(100vh - 100px),880px);min-width:min(100%,440px);position:relative}
#right{width:624px;max-width:100%;height:calc(100vh - 16px);min-height:600px;background:#262421;border-radius:6px;display:flex;flex-direction:column;overflow:hidden}
@media(max-width:1500px){#right{width:520px}}
.player{display:flex;align-items:center;gap:12px;padding:0 0 0 50px;height:42px}
#pTop{margin-bottom:0}
.av{width:40px;height:40px;border-radius:4px;background:#e5e5e3;flex:none}.av.b{background:#989795}
.av img{width:100%;height:100%}
.who{flex:1;min-width:0;align-self:center}.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}.who small{color:#a7a6a2;font-weight:600}
.cap{display:flex;align-items:center;height:16px}.cap img{width:16px;height:16px;margin-right:-5px;filter:drop-shadow(0 0 1px #fff9)}.cap span{margin-left:9px;color:#a7a6a2;font-size:12px}
.clock{background:#211f1c;border-radius:4px;padding:6px 12px;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
#gear{position:absolute;right:0;top:6px;background:none;border:0;color:#a7a6a2;font-size:22px;cursor:pointer;z-index:6}
#menu{position:absolute;right:0;top:40px;background:#211f1c;border:1px solid #45423d;border-radius:6px;z-index:6;display:flex;flex-direction:column;padding:4px;box-shadow:0 8px 24px #0008}
#menu button{background:none;border:0;text-align:left;border-radius:4px}#menu button.off{color:#888;text-decoration:line-through}
#row{display:flex;gap:12px;margin:2px 0}
#bar{width:38px;background:#403d39;border-radius:3px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:flex-end}
#bar.flip{justify-content:flex-start}
#fill{background:#fff;height:50%;transition:height .4s}
#num{position:absolute;left:0;right:0;bottom:8px;font-size:11px;font-weight:700;text-align:center;color:#403d39}
#num.dark{bottom:auto;top:8px;color:#fff}
#board{flex:1;aspect-ratio:1;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);position:relative;container-type:inline-size;user-select:none;border-radius:3px}
.sq{position:relative;background:#ebecd0;color:#739552;min-width:0;min-height:0}
.sq.d{background:#739552;color:#ebecd0}
.sq .hl{position:absolute;inset:0;opacity:.5}
.sq img.p{position:absolute;inset:0;width:100%;height:100%}
.sq b{position:absolute;font-size:2.6cqw;line-height:1;z-index:1}
.rk{left:.6cqw;top:.7cqw}.fl{right:.6cqw;bottom:.4cqw}
.badge{position:absolute;width:42%;height:42%;top:-15%;right:-15%;z-index:3;filter:drop-shadow(0 2px 2px #0006);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.3)}70%{transform:scale(1.15)}}
#arrow{position:absolute;inset:0;pointer-events:none;z-index:2}
button,select{background:#3d3a37;color:#fff;border:0;border-radius:6px;padding:9px 14px;font:inherit;cursor:pointer}
button:hover{background:#4b4845}button:disabled{opacity:.45;cursor:default}
.big{width:100%;height:78px;font-size:25px;font-weight:800;border-radius:9px;background:linear-gradient(#81b64c,#5d9948);box-shadow:inset 0 1px #fff3,0 3px 0 #45753c;text-shadow:0 2px 2px #0004}
.big:hover{background:linear-gradient(#95c95f,#6aab52)}
#top{height:60px;flex:none;background:#21201d;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:20px;font-weight:800}
#top span{flex:1;display:flex;justify-content:center;align-items:center;gap:10px}#top span img{width:28px;height:28px}
#top button{background:none;font-size:22px;color:#a7a6a2;width:40px;height:40px;padding:0}#top button:hover{color:#fff}
.view{flex:1;overflow:auto;padding:20px 30px;display:flex;flex-direction:column;gap:18px;min-height:0}
.foot{flex:none;padding:10px 30px 20px}
.coach{display:flex;align-items:flex-end;gap:14px;flex:none}
.coach>svg{width:112px;height:120px;flex:none}
.bubble{position:relative;flex:1;background:#fff;color:#312e2b;border-radius:10px;padding:14px 18px;font-size:16px;line-height:1.45;align-self:center;min-height:76px;font-weight:600}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;border:9px solid transparent;border-right-color:#fff;border-left:0;border-right-width:13px}
.bubble .t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}.bubble .t img{width:28px;height:28px}
#graph{width:100%;height:100px;flex:none;background:#4b4846;border-radius:5px;cursor:pointer;display:block}
.g{display:grid;grid-template-columns:minmax(0,1.5fr) 1fr 56px 1fr;align-items:center;justify-items:center;row-gap:16px;column-gap:6px}
.g>.l{justify-self:start}
.g img.i{width:30px;height:30px}
.g .n{font-size:18px;font-weight:800}
.name{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.g .av{width:80px;height:80px}.g .av.w{border:3px solid #81b64c}
.box{background:#312e2b;border-radius:5px;width:80px;padding:9px 0;text-align:center;font-size:20px;font-weight:800}.box.w{background:#fff;color:#312e2b}
hr{border:0;border-top:1px solid #45423e;flex:none}
textarea{width:100%;flex:1;min-height:170px;background:#1c1b19;color:#ddd;border:1px solid #45423d;border-radius:8px;padding:10px;font:12px Consolas,monospace;resize:vertical}
#drop{border:2px dashed #4b4845;border-radius:10px;padding:16px;text-align:center;cursor:pointer;color:#a7a6a2;display:block;flex:none}
#drop:hover,#drop.over{border-color:#81b64c;color:#fff}
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#progBox{flex:none;padding:12px 30px 0;color:#c9c7c3;overflow-wrap:anywhere}#progBox:has(#status:empty){display:none}
progress{width:100%;height:10px;accent-color:#81b64c;margin-bottom:4px}
.pv{display:flex;gap:10px;align-items:center;padding:3px 0;font-size:13px}.chip{background:#3d3a37;border-radius:4px;min-width:58px;text-align:center;padding:3px 6px;font-size:12px;font-weight:800}.pv div:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c9c7c3;min-width:0}
#opening{color:#a7a6a2}#opening:empty{display:none}
[hidden]{display:none!important}
@media(max-width:600px){main{padding:8px}#right{height:auto;min-height:0}.view{padding:16px 12px}#f-load,#f-summary,#progBox{padding-left:12px;padding-right:12px}.player{padding-left:0}#bar{width:24px}#row{gap:5px}.coach>svg{width:76px;height:84px}.g .av{width:56px;height:56px}.big{height:60px;font-size:20px}#moves{max-height:300px;flex:none}}
#v-review{padding:0;gap:0;overflow:hidden}
svg.ic{width:28px;height:28px;flex:none}
#top .ic{display:none}#right.an #top .ic{display:block}#right.an #logo,#right.an #open,#right.an #back{display:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);flex:none;border-top:1px solid #3a3835;background:#1f1e1b}
.tabs button{background:none;border-radius:0;color:#989795;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;font-size:14px}.tabs button:hover{color:#fff;background:#262421}.tabs button.on{background:#262421;color:#fff}
.pane{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto}
.bar{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:50px;flex:none;border-bottom:1px solid #3a3835;color:#c9c7c3}
.bar .sp{margin-left:auto}
.bar button{background:none;padding:4px 8px;color:#989795;font-size:18px}.bar button:hover{color:#fff}
#toggle{display:flex;align-items:center;gap:10px;font-size:15px;color:#c9c7c3;padding:4px 0}
#toggle i{width:32px;height:16px;border-radius:9px;background:#81b64c;position:relative}#toggle i::after{content:"✓";position:absolute;right:-1px;top:-2px;width:20px;height:20px;border-radius:50%;background:#fff;color:#444;font:800 12px/20px sans-serif;text-align:center;font-style:normal}
#toggle.off i{background:#4b4845}#toggle.off i::after{content:"";right:14px}
#linesBox{flex:none;border-bottom:1px solid #3a3835;padding:8px 0;min-height:121px}
.pv{display:flex;align-items:flex-start;gap:10px;padding:2px 14px 2px 0;font-size:15px;line-height:30px}
.chip{background:#fff;color:#312e2b;border-radius:3px;min-width:62px;text-align:center;font-weight:800;height:30px;flex:none}.chip.neg{background:#403d39;color:#fff}
.pv .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pv.open .t{white-space:normal}
.pv button{background:none;color:#989795;padding:0 4px;line-height:30px;height:30px}
img.fg[src]{filter:drop-shadow(0 0 1px #fffc)}img.fg{width:21px;height:21px;vertical-align:-5px;margin-right:1px}
#posRow{min-height:50px;padding-top:6px;padding-bottom:6px}#posRow img.ci{width:24px;height:24px}
#playersRow{font-size:16px;color:#fff}#playersRow div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#playersRow small{color:#c9c7c3;font-size:15px;font-weight:600}
#moves{flex:1;min-height:150px;overflow:auto;position:relative}
.mr{display:grid;grid-template-columns:64px 125px 125px;align-items:center;min-height:37px;padding:0 4px}.mr:nth-child(even){background:#2a2926}.mr>span{color:#989795;padding-left:4px}
.mv{justify-self:start;cursor:pointer;font-weight:800;font-size:15px;color:#c9c7c3;border-radius:4px;padding:3px 8px 3px 2px;border-bottom:3px solid transparent}.mv:hover{color:#fff}.mv.on{background:#4b4845;border-bottom-color:#6b6865;color:#fff}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border-radius:0;border-bottom:1px solid #3a3835;padding:12px 16px;flex:none}.item.on{background:#3d3a37}
.note{padding:14px 16px;color:#989795}
#f-review{padding:12px 6px 8px;background:#21201d}
#nav{display:flex;gap:10px}#nav button{flex:1;height:60px;display:flex;align-items:center;justify-content:center}#nav svg{width:30px;height:30px}#nav button:disabled{opacity:.35}
#actions{display:flex;justify-content:space-around;margin-top:8px}#actions button{background:none;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;color:#c9c7c3}#actions button:hover{color:#fff}
#more{position:absolute;right:12px;bottom:62px;background:#1c1b19;border:1px solid #4b4845;border-radius:8px;padding:4px;display:flex;flex-direction:column;box-shadow:0 8px 24px #000a;z-index:9}#more button{background:none;text-align:left}#more button:hover{background:#3d3a37}
#right{position:relative}
</style></head><body><main>
<section id="left">
 <button id="gear" title="Opções">⚙</button>
 <div id="menu" hidden><button id="flip">⇅ Virar tabuleiro (F)</button><button id="tArrow">➚ Seta do melhor lance</button><button id="copyFen">Copiar FEN</button><button id="export" disabled>⬇ Baixar PGN avaliado</button></div>
 <div class="player" id="pTop"></div>
 <div id="row"><div id="bar"><div id="fill"></div><div id="num"></div></div><div id="board"></div></div>
 <div class="player" id="pBot"></div>
</section>
<section id="right">
 <div id="top"><button id="back" title="Voltar" hidden>‹</button><span><img id="logo" alt=""><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="8"/><path d="M16.5 16.5L22 22"/><circle cx="10.5" cy="10.5" r="2.6" fill="currentColor" stroke="none"/></svg><em id="title" style="font-style:normal">Revisão da Partida</em></span><button id="open" title="Carregar outro PGN">📂</button></div>
 <div id="progBox"><progress id="prog" value="0" max="1" hidden></progress><div id="status"></div></div>
 <div class="view" id="v-load">
  <div class="coach"><svg viewBox="0 0 112 120" aria-label="Peão com vara de pescar"><image class="peao" x="-6" y="14" width="104" height="104"/><g fill="none" stroke-linecap="round"><path d="M56 96L102 8" stroke="#2b2723" stroke-width="5.5"/><path d="M56 96L102 8" stroke="#b9854a" stroke-width="2.6"/><path d="M102 8q7 32 2 66" stroke="#d8dde0" stroke-width="1.3"/><path d="M104 74v9q-1 7-7 4l-1-4" stroke="#d8dde0" stroke-width="2.2"/></g></svg><div class="bubble">Joga o PGN na rede que eu analiso.</div></div>
  <label id="drop">📂 <b>Arraste o arquivo .pgn aqui</b><br>ou clique para escolher<input type="file" id="file" accept=".pgn,.txt" hidden></label>
  <textarea id="pgn" placeholder="...ou cole aqui o conteúdo do PGN"></textarea>
  <select id="games" hidden style="width:100%"></select>
  <div class="line"><label>Análise <select id="depth"><option value="10">Rápida</option><option value="13" selected>Normal</option><option value="17">Profunda</option></select></label><button id="example" style="margin-left:auto">Exemplo</button><button id="clear">Limpar</button></div>
  <div class="line" id="localBox" hidden><label>Escolha o arquivo stockfish.js: <input type="file" id="sf" accept=".js"></label></div>
 </div>
 <div class="view" id="v-summary" hidden>
  <div id="opening" hidden></div>
  <div class="coach"><svg viewBox="0 0 112 120" aria-label="Peão com vara de pescar"><image class="peao" x="-6" y="14" width="104" height="104"/><g fill="none" stroke-linecap="round"><path d="M56 96L102 8" stroke="#2b2723" stroke-width="5.5"/><path d="M56 96L102 8" stroke="#b9854a" stroke-width="2.6"/><path d="M102 8q7 32 2 66" stroke="#d8dde0" stroke-width="1.3"/><path d="M104 74v9q-1 7-7 4l-1-4" stroke="#d8dde0" stroke-width="2.2"/></g></svg><div class="bubble" id="say"></div></div>
  <svg id="graph" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  <div class="g" id="players"></div><hr><div class="g" id="table"></div><hr><div class="g" id="rating"></div><hr><div class="g" id="phases"></div>
 </div>
 <div class="view" id="v-review" hidden>
  <nav class="tabs"><button data-t="an" class="on"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="8"/><path d="M16.5 16.5L22 22"/><circle cx="10.5" cy="10.5" r="2.6" fill="currentColor" stroke="none"/></svg>Análise</button><button data-t="games"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M2 6h7l2 3h11v12H2z"/><path d="M12 2h3v3h-3zM18 2h3v3h-3zM15 5h3v3h-3z"/></svg>Partidas</button><button data-t="exp"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="10"/><path d="M16.5 7.5l-3 6-6 3 3-6z" fill="currentColor" stroke="none"/></svg>Explorar</button></nav>
  <div class="pane" id="pane-an">
   <div class="bar"><button id="toggle"><i></i>Análise</button><span class="sp" id="engInfo"></span><button id="eng" title="Mudar a análise">⚙</button></div>
   <div id="linesBox"><div id="lines"></div></div>
   <div class="bar" id="posRow"></div>
   <div class="bar" id="playersRow"></div>
   <div id="moves"></div>
  </div>
  <div class="pane" id="pane-games" hidden></div>
  <div class="pane" id="pane-exp" hidden></div>
 </div>
 <div class="foot" id="f-load"><button id="go" class="big">Avaliar partida</button></div>
 <div class="foot" id="f-summary" hidden><button id="start" class="big" disabled>Começar a Revisão</button></div>
 <div class="foot" id="f-review" hidden>
  <div id="nav"><button data-n="start" title="Início (↑)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14M18 5l-8 7 8 7"/></svg></button><button data-n="-1" title="Anterior (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><button data-n="1" title="Próximo (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button><button data-n="end" title="Fim (↓)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v14M6 5l8 7-8 7"/></svg></button></div>
  <div id="actions"><button id="aNew"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="8"/><path d="M16.5 16.5L22 22"/><circle cx="10.5" cy="10.5" r="2.6" fill="currentColor" stroke="none"/></svg>Novo</button><button id="aSave">⬇ Salvar</button><button id="toSum">★ Revisar</button><button id="aMore" title="Mais opções">•••</button></div>
  <div id="more" hidden><button id="play">▶ Reproduzir</button><button id="prevKey">« Momento-chave anterior</button><button id="nextKey">» Próximo momento-chave</button><button id="mFlip">⇅ Virar tabuleiro</button><button id="mFen">Copiar FEN</button></div>
 </div>
</section></main>

function exportPgn(){const nag={brilliant:'$3',great:'$1',inaccuracy:'$6',mistake:'$2',miss:'$2',blunder:'$4'};
 const tags=Object.entries(G.tags).map(([k,v])=>`[${k} "${String(v).replace(/(["\\])/g,'\\$1')}"]`).join('\n');
 const body=G.moves.map((m,i)=>{const s=G.states[i],r=R[i];return`${s.t==='w'?s.n+'. ':s.n+'... '}${m.san}${r&&nag[r.cls]?' '+nag[r.cls]:''}${r?` {${CLS[r.cls][0]}}`:''}`}).join(' ');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([`${tags}\n\n${body} ${G.tags.Result||'*'}\n`],{type:'application/x-chess-pgn'}));a.download='partida-avaliada.pgn';a.click()}
// desliza a peça do último lance da casa de origem até o destino
function slide(){const m=ply&&G.moves[ply-1],img=m&&$('board').querySelector(`img.p[data-i="${m.to}"]`);if(!img)return;const s=flipped?-1:1;
 img.style.zIndex=2;img.animate([{transform:`translate(${(m.from%8-m.to%8)*100*s}%,${((m.from>>3)-(m.to>>3))*100*s}%)`},{transform:'none'}],{duration:110,easing:'ease-out'})}
function go(p){if(!G||busy)return;const n=Math.max(0,Math.min(G.moves.length,p)),changed=n!==ply,forward=n===ply+1;ply=n;render();if(changed){if(forward)slide();moveSound()}}
function stopAuto(){clearInterval(timer);timer=null;$('play').textContent='▶ Reproduzir'}
function toggleAuto(){if(timer)return stopAuto();if(!G||busy)return;if(ply>=G.moves.length)go(0);$('play').textContent='⏸ Pausar';timer=setInterval(()=>{go(ply+1);if(ply>=G.moves.length)stopAuto()},1000)}
const step=n=>{stopAuto();if(G)go(n==='start'?0:n==='end'?G.moves.length:ply+ +n)};
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>step(b.dataset.n));
$('play').onclick=toggleAuto;$('flip').onclick=()=>{flipped=!flipped;render()};$('go').onclick=analyze;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setPane(b.dataset.t));
$('toggle').onclick=()=>{showAn=!showAn;$('toggle').classList.toggle('off',!showAn);render()};
$('lines').onclick=e=>{const b=e.target.closest('[data-l]');if(b){openLines[+b.dataset.l]^=1;engineLines()}};
$('eng').onclick=$('aNew').onclick=()=>view('load');$('aSave').onclick=()=>{if(G&&!$('export').disabled)exportPgn()};
$('aMore').onclick=e=>{e.stopPropagation();$('more').hidden=!$('more').hidden};document.addEventListener('click',()=>$('more').hidden=true);
$('mFlip').onclick=()=>$('flip').click();$('mFen').onclick=()=>$('copyFen').click();
$('pane-exp').onclick=e=>{const b=e.target.closest('[data-p]');if(b){stopAuto();go(+b.dataset.p)}};
$('pane-games').onclick=e=>{const b=e.target.closest('[data-g]');if(b){listGames();$('games').value=b.dataset.g;setPane('an');analyze()}};
$('moves').onclick=e=>{const d=e.target.closest('[data-p]');if(d){stopAuto();go(+d.dataset.p)}};
$('graph').onclick=e=>{if(!G||!E.length)return;const b=$('graph').getBoundingClientRect();stopAuto();go(Math.round((e.clientX-b.left)/b.width*(G.states.length-1)))};
function listGames(){const gs=splitPgn($('pgn').value),sel=$('games');sel.hidden=gs.length<2;
 sel.innerHTML=gs.map((g,i)=>`<option value="${i}">${i+1}. ${esc(g.tags.White||'?')} x ${esc(g.tags.Black||'?')} ${esc(g.tags.Result||'')} ${esc(g.tags.Date||'')}</option>`).join('')}
$('pgn').oninput=listGames;
async function openFile(f){if(f){$('pgn').value=await f.text();listGames();view('load');$('progBox').hidden=false;$('status').textContent='PGN carregado: '+f.name}}
$('file').onchange=e=>{openFile(e.target.files[0]);e.target.value=''};
document.ondragover=e=>{e.preventDefault();$('drop').classList.add('over')};document.ondragleave=()=>$('drop').classList.remove('over');
document.ondrop=e=>{e.preventDefault();$('drop').classList.remove('over');const f=e.dataTransfer.files[0];if(f)openFile(f);else{$('pgn').value=e.dataTransfer.getData('text');listGames()}};
$('open').onclick=()=>{view('load');$('pgn').focus()};
$('back').onclick=()=>view('summary');$('toSum').onclick=()=>view('summary');
$('start').onclick=()=>{view('review');go(0);go(1)};
$('gear').onclick=e=>{e.stopPropagation();$('menu').hidden=!$('menu').hidden};document.addEventListener('click',e=>{if(!e.target.closest('#menu'))$('menu').hidden=true});
$('clear').onclick=()=>{$('pgn').value='';listGames()};
$('example').onclick=()=>{$('pgn').value=`[Event "Partida da Ópera"]\n[Site "Paris"]\n[Date "1858.??.??"]\n[White "Paul Morphy"]\n[Black "Duque e Conde"]\n[Result "1-0"]\n\n1. e4 e5 2. Nf3 d6 3. d4 Bg4 4. dxe5 Bxf3 5. Qxf3 dxe5 6. Bc4 Nf6 7. Qb3 Qe7 8. Nc3 c6 9. Bg5 b5 10. Nxb5 cxb5 11. Bxb5+ Nbd7 12. O-O-O Rd8 13. Rxd7 Rxd7 14. Rd1 Qe6 15. Bxd7+ Nxd7 16. Qb8+ Nxb8 17. Rd8# 1-0`;listGames()};
$('prevKey').onclick=()=>keyMove(-1);$('nextKey').onclick=()=>keyMove(1);
$('tArrow').onclick=e=>{arrowOn=!arrowOn;e.target.classList.toggle('off',!arrowOn);render()};
$('copyFen').onclick=async e=>{const f=fen(G?G.states[ply]:parseFen(START)),b=e.target;try{await navigator.clipboard.writeText(f);b.textContent='Copiado ✓'}catch(x){prompt('FEN:',f)}setTimeout(()=>b.textContent='Copiar FEN',1500)};
$('export').onclick=exportPgn;
$('logo').src=ICON.best;document.querySelectorAll('.peao').forEach(i=>i.setAttribute('href',PIECE.wP));
$('sf').onchange=e=>{localSF=e.target.files[0]||null;if(localSF)analyze()};
document.onkeydown=e=>{if(/TEXTAREA|SELECT|INPUT/.test(e.target.tagName))return;const k={ArrowLeft:'-1',ArrowRight:'1',ArrowUp:'start',ArrowDown:'end',Home:'start',End:'end'}[e.key];
 if(k){e.preventDefault();step(k)}else if(e.key===' '){e.preventDefault();toggleAuto()}else if(e.key.toLowerCase()==='f')$('flip').click()};
render();
</script></body></html>
